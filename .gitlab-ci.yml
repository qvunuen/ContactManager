stages:
  - build_and_test
  - release

linux_x64:
  stage: build_and_test
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential cmake ninja-build qt6-base-dev libsqlite3-dev libboost-test-dev
  script:
    - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
    - ctest --test-dir build --output-on-failure
    - ./build/tests/ContactManagerTests --logger=JUNIT,message,build/test-results-linux.xml
    - mkdir -p dist
    - tar -czf dist/ContactManager-linux-x64.tar.gz -C bin ContactManager
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      junit: build/test-results-linux.xml

windows_x64:
  stage: build_and_test
  # Uses GitLab SaaS Windows runner tag; replace with your self-hosted tag (e.g. [windows]) if needed
  tags:
    - saas-windows-medium-amd64
  variables:
    VCPKG_TARGET_TRIPLET: x64-windows
  script:
    - |
      $ErrorActionPreference = "Stop"
      $cmakeArgs = @("-S", ".", "-B", "build", "-DCMAKE_BUILD_TYPE=Release", "-DDEPLOY_QT_RUNTIME=ON")
      if ($env:VCPKG_ROOT) {
        if (Test-Path "$env:VCPKG_ROOT/vcpkg.exe") {
          & "$env:VCPKG_ROOT/vcpkg.exe" install "sqlite3:$env:VCPKG_TARGET_TRIPLET" "boost-test:$env:VCPKG_TARGET_TRIPLET"
        }
        $cmakeArgs += "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      }
      if ($env:QT_ROOT_DIR) {
        $cmakeArgs += "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
      }
      cmake @cmakeArgs
      cmake --build build --config Release
      ctest --test-dir build -C Release --output-on-failure
      $testExe = if (Test-Path "build/tests/Release/ContactManagerTests.exe") {
        "build/tests/Release/ContactManagerTests.exe"
      } else {
        "build/tests/ContactManagerTests.exe"
      }
      & $testExe --logger=JUNIT,message,build/test-results-windows.xml
      New-Item -ItemType Directory -Force -Path dist | Out-Null
      $pkgSource = if (Test-Path "bin/Release") { "bin/Release/*" } else { "bin/*" }
      Compress-Archive -Path $pkgSource -DestinationPath "dist/ContactManager-windows-x64.zip" -Force
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      junit: build/test-results-windows.xml

macos:
  stage: build_and_test
  # Uses GitLab SaaS Apple Silicon runner tag (Premium/Ultimate) or self-hosted Mac runner tag
  tags:
    - saas-macos-medium-m1
  before_script:
    - brew list cmake qt boost >/dev/null 2>&1 || brew install cmake qt boost
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDEPLOY_QT_RUNTIME=ON
    - cmake --build build
    - ctest --test-dir build --output-on-failure
    - ./build/tests/ContactManagerTests --logger=JUNIT,message,build/test-results-macos.xml
    - mkdir -p dist
    - ditto -c -k --sequesterRsrc --keepParent bin/ContactManager.app dist/ContactManager-macos.zip
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      junit: build/test-results-macos.xml

release_app:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: linux_x64
      artifacts: true
    - job: windows_x64
      artifacts: true
    - job: macos
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for file in dist/*; do
        filename=$(basename "$file")
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/${filename}"
      done
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "PhoneBook Manager $CI_COMMIT_TAG"
    description: "Cross-platform release $CI_COMMIT_TAG (Linux x64, Windows x64, macOS)."
    assets:
      links:
        - name: "ContactManager-linux-x64.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/ContactManager-linux-x64.tar.gz"
        - name: "ContactManager-windows-x64.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/ContactManager-windows-x64.zip"
        - name: "ContactManager-macos.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/ContactManager-macos.zip"
