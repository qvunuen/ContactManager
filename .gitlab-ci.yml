stages:
  - build_and_test
  - release

linux_x64:
  stage: build_and_test
  # Uses your Docker runner on Linux/WSL2 (remove tags if using untagged shared runners)
  tags:
    - linux
  image: ubuntu:24.04
  variables:
    DEBIAN_FRONTEND: noninteractive
    VCPKG_DEFAULT_BINARY_CACHE: "${CI_PROJECT_DIR}/.vcpkg-cache"
  cache:
    key: vcpkg-linux-x64
    paths:
      - .vcpkg/
      - .vcpkg-cache/
  before_script:
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      build-essential cmake ninja-build git curl zip unzip tar pkg-config python3
      bison flex gperf ca-certificates
      libx11-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev
      libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-keysyms1-dev
      libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev
      libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev
      libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev
      libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libdbus-1-dev
  script:
    - |
      if [ -z "${VCPKG_ROOT:-}" ] || [ ! -x "${VCPKG_ROOT}/vcpkg" ]; then
        export VCPKG_ROOT="${CI_PROJECT_DIR}/.vcpkg"
        if [ ! -x "${VCPKG_ROOT}/vcpkg" ]; then
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
        fi
      fi
      mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
      cmake --preset vcpkg-linux
      cmake --build --preset vcpkg-linux
      ctest --preset vcpkg-linux
      ./build/tests/ContactManagerTests --logger=JUNIT,message,build/test-results-linux.xml
      mkdir -p dist
      tar -czf dist/ContactManager-linux-x64.tar.gz -C bin ContactManager
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      junit: build/test-results-linux.xml

windows_x64:
  stage: build_and_test
  # Uses your Windows shell runner
  tags:
    - windows
  variables:
    VCPKG_DEFAULT_BINARY_CACHE: "${CI_PROJECT_DIR}\\.vcpkg-cache"
  cache:
    key: vcpkg-windows-x64
    paths:
      - .vcpkg/
      - .vcpkg-cache/
  script:
    - |
      $ErrorActionPreference = "Stop"
      if (-not $env:VCPKG_ROOT -or -not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
        $env:VCPKG_ROOT = "$env:CI_PROJECT_DIR\.vcpkg"
        if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
        }
      }
      New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      cmake --preset vcpkg-windows
      cmake --build --preset vcpkg-windows
      ctest --preset vcpkg-windows
      $testExe = if (Test-Path "build/tests/Release/ContactManagerTests.exe") {
        "build/tests/Release/ContactManagerTests.exe"
      } else {
        "build/tests/ContactManagerTests.exe"
      }
      & $testExe --logger=JUNIT,message,build/test-results-windows.xml
      New-Item -ItemType Directory -Force -Path dist | Out-Null
      $pkgSource = if (Test-Path "bin/Release") { "bin/Release/*" } else { "bin/*" }
      Compress-Archive -Path $pkgSource -DestinationPath "dist/ContactManager-windows-x64.zip" -Force
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
    reports:
      junit: build/test-results-windows.xml

release_app:
  stage: release
  tags:
    - linux
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: linux_x64
      artifacts: true
    - job: windows_x64
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  before_script:
    - apk add --no-cache curl
  script:
    - |
      for file in dist/*; do
        filename=$(basename "$file")
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/${filename}"
      done
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "PhoneBook Manager $CI_COMMIT_TAG"
    description: "Cross-platform release $CI_COMMIT_TAG (Linux x64, Windows x64)."
    assets:
      links:
        - name: "ContactManager-linux-x64.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/ContactManager-linux-x64.tar.gz"
        - name: "ContactManager-windows-x64.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/contact-manager/${CI_COMMIT_TAG}/ContactManager-windows-x64.zip"
